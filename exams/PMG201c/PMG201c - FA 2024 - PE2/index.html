<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><title>PMG201c - FA 2024 - PE2</title>
<link rel="stylesheet" href="../../../assets/css/style.css"/>
<style>
    .lightbox-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        gap: 10px;
    }
    .nav-button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
        border-radius: 5px;
        font-size: 14px;
        transition: background-color 0.3s;
    }
    .nav-button:hover {
        background-color: #0056b3;
    }
    .nav-button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
    }
    .image-counter {
        font-weight: bold;
        color: #333;
    }
</style>
</head><body>
<div class="header"><div class="logo">FuOverflow Clone</div></div>
<div class="container"><h1>PMG201c - FA 2024 - PE2</h1>
<div class="image-grid">

        <div class="image-item" data-img="images/image_1.webp">
            <img src="images/image_1.webp" alt="" loading="lazy"/>
            <div class="image-overlay">Click để xem + bình luận</div>
        </div>
        
        <div class="image-item" data-img="images/image_2.webp">
            <img src="images/image_2.webp" alt="" loading="lazy"/>
            <div class="image-overlay">Click để xem + bình luận</div>
        </div>
        
</div>

<!-- LIGHTBOX MỚI -->
<div id="lightbox" class="lightbox">
    <span class="close-lightbox">×</span>
    <div class="lightbox-content">
        <div class="lightbox-nav">
            <button class="nav-button" id="prev-btn">← Quay lại</button>
            <span class="image-counter"><span id="current-index">1</span> / <span id="total-images">0</span></span>
            <button class="nav-button" id="next-btn">Tiếp theo →</button>
        </div>
        <img id="lightbox-img" src="" alt="" loading="lazy"/>
        <div class="lightbox-comments">
            <h3>Bình luận</h3>
            <div id="comment-list"></div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const items = document.querySelectorAll('.image-item');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const commentList = document.getElementById('comment-list');
    const close = document.querySelector('.close-lightbox');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const currentIndexSpan = document.getElementById('current-index');
    const totalImagesSpan = document.getElementById('total-images');

    // DỮ LIỆU BÌNH LUẬN
    const commentsData = {"image_1.webp": [{"username": "Minthep", "content": "req 1 : chọn đại project\nnêu lí do chọn, mục tiêu ( nên ghi 2 cái)\nđối tác, nhà tài trợ: ABC Corporation\nttiêuchis đánh giá thành công\nvà hạn chế của dự én", "timestamp": "2025-08-24T03:00:53+0700", "vote": "3467"}, {"username": "Minthep", "content": "req 2: Thường thì chọn matrix (bao gồm functional + projectize)\nfunctional nó theo chiều dọc -> kiểu như bạn làm IT thì có phòng ban IT, mọi thứ đều báo với sếp.\n\nMatrix thì kiểu cử 1-2 người mỗi phòng ban ra làm project (đảm bảo -project có đủ nhân sự + quyền để truy cập tài nguyên)", "timestamp": "2025-08-24T03:02:12+0700", "vote": "3467"}, {"username": "Minthep", "content": "req3 : chú ý về lỗi thanh toán, lỗi performance, lỗi bảo mật-> đánh giá rủi ro, đánh giá , và luôn có giải pháp (res)", "timestamp": "2025-08-24T03:06:53+0700", "vote": "3467"}], "image_2.webp": [{"username": "Minthep", "content": "4:\n\nStart có 2: A D\nEnd có 1\n\nABCG: 4326 = 15\nDBCG -16\nDEFG: 5426= 17\nDHI: 559 19\n\nTrường l lười tới mức thậm chí còn không đổi bảng,..", "timestamp": "2025-08-24T03:22:13+0700", "vote": "3467"}, {"username": "Minthep", "content": "fassk-tracking\ncrash\noutsrc fpt\nOvertime\nscore reduction,,,", "timestamp": "2025-08-24T03:34:53+0700", "vote": "3467"}, {"username": "Minthep", "content": "req 5 tôi học 10 năm rồi\nchép phao vô thi thôi nhớ cái nịt", "timestamp": "2025-08-24T03:42:29+0700", "vote": "3467"}, {"username": "Minthep", "content": "AC = 120000\nPV\nCV\n\ncòn EV earn va lu, SV, CPI SPI\n\nEV= AC + CV\nSV= ev-pv\nspi = ev/pv\nExpect higher total cost and longer duration if no corrective actions are taken.", "timestamp": "2025-08-24T03:44:18+0700", "vote": "3467"}]};
    
    // Mảng chứa tất cả ảnh
    let allImages = [];
    let currentIndex = -1;

    // Khởi tạo mảng ảnh
    items.forEach((item, index) => {
        allImages.push({
            element: item,
            src: item.getAttribute('data-img')
        });
    });

    totalImagesSpan.textContent = allImages.length;

    // Hàm hiển thị ảnh theo index
    function showImageByIndex(index) {
        if (index < 0 || index >= allImages.length) return;
        
        currentIndex = index;
        const img = allImages[index];
        lightboxImg.src = img.src + '?t=' + Date.now();
        currentIndexSpan.textContent = index + 1;

        // Cập nhật trạng thái nút
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === allImages.length - 1;

        // Hiển thị bình luận
        const imgName = img.src.split('/').pop();
        const comments = commentsData[imgName] || [];
        commentList.innerHTML = '';
        if (comments.length === 0) {
            commentList.innerHTML = '<p class="no-comment">Chưa có bình luận</p>';
        } else {
            comments.forEach(c => {
                const div = document.createElement('div');
                div.className = 'comment';
                div.innerHTML = `
                    <div class="comment-header">
                        <span class="username">${c.username}</span>
                        <span class="vote">Vote: ${c.vote}</span>
                    </div>
                    <p>${c.content.replace(/\n/g, '<br>')}</p>
                `;
                commentList.appendChild(div);
            });
        }
    }

    // Click vào ảnh để mở lightbox
    items.forEach((item, index) => {
        item.addEventListener('click', () => {
            lightbox.classList.add('active');
            showImageByIndex(index);
        });
    });

    // Nút điều hướng
    prevBtn.onclick = () => {
        if (currentIndex > 0) showImageByIndex(currentIndex - 1);
    };

    nextBtn.onclick = () => {
        if (currentIndex < allImages.length - 1) showImageByIndex(currentIndex + 1);
    };

    // Đóng lightbox
    close.onclick = () => lightbox.classList.remove('active');
    lightbox.onclick = (e) => { if (e.target === lightbox) lightbox.classList.remove('active'); };

    // Phím tắt: Arrow Left/Right để điều hướng
    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'ArrowLeft') prevBtn.click();
        if (e.key === 'ArrowRight') nextBtn.click();
    });
});
</script>
</body></html>
