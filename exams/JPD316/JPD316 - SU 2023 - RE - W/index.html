<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><title>JPD316 - SU 2023 - RE - W</title>
<link rel="stylesheet" href="../../../assets/css/style.css"/>
<style>
    .lightbox-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        gap: 10px;
    }
    .nav-button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
        border-radius: 5px;
        font-size: 14px;
        transition: background-color 0.3s;
    }
    .nav-button:hover {
        background-color: #0056b3;
    }
    .nav-button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
    }
    .image-counter {
        font-weight: bold;
        color: #333;
    }
</style>
</head><body>
<div class="header"><div class="logo">FuOverflow Clone</div></div>
<div class="container"><h1>JPD316 - SU 2023 - RE - W</h1>
<div class="image-grid">

        <div class="image-item" data-img="images/image_1.webp">
            <img src="images/image_1.webp" alt="" loading="lazy"/>
            <div class="image-overlay">Click để xem + bình luận</div>
        </div>
        
        <div class="image-item" data-img="images/image_2.webp">
            <img src="images/image_2.webp" alt="" loading="lazy"/>
            <div class="image-overlay">Click để xem + bình luận</div>
        </div>
        
</div>

<!-- LIGHTBOX MỚI -->
<div id="lightbox" class="lightbox">
    <span class="close-lightbox">×</span>
    <div class="lightbox-content">
        <div class="lightbox-nav">
            <button class="nav-button" id="prev-btn">← Quay lại</button>
            <span class="image-counter"><span id="current-index">1</span> / <span id="total-images">0</span></span>
            <button class="nav-button" id="next-btn">Tiếp theo →</button>
        </div>
        <img id="lightbox-img" src="" alt="" loading="lazy"/>
        <div class="lightbox-comments">
            <h3>Bình luận</h3>
            <div id="comment-list"></div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const items = document.querySelectorAll('.image-item');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const commentList = document.getElementById('comment-list');
    const close = document.querySelector('.close-lightbox');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const currentIndexSpan = document.getElementById('current-index');
    const totalImagesSpan = document.getElementById('total-images');

    // DỮ LIỆU BÌNH LUẬN
    const commentsData = {"image_1.webp": [{"username": "khanhpn31", "content": "1。荷物をおく\n2。地震\n3。間に合い\n4。安全なところへ逃げる\n5。肘をテーブルにつく", "timestamp": "2024-06-26T09:50:45+0700", "vote": "7"}, {"username": "khanhpn31", "content": "2。作って\n3。プリンとかゼリー", "timestamp": "2024-06-26T09:53:02+0700", "vote": "7"}, {"username": "namthanhoatieudietlgbt", "content": "1. 車を止めると\n2.　台風\n3.　遅れ\n4.　風が強くになります\n5.　テレビをみる\n\n２\n\n6. いる\n7. 作って\n8.　ケーキ...アイスクリーム\n9.　開けた\n10. 大雨の", "timestamp": "2025-11-04T16:22:10+0700", "vote": "3"}], "image_2.webp": []};
    
    // Mảng chứa tất cả ảnh
    let allImages = [];
    let currentIndex = -1;

    // Khởi tạo mảng ảnh
    items.forEach((item, index) => {
        allImages.push({
            element: item,
            src: item.getAttribute('data-img')
        });
    });

    totalImagesSpan.textContent = allImages.length;

    // Hàm hiển thị ảnh theo index
    function showImageByIndex(index) {
        if (index < 0 || index >= allImages.length) return;
        
        currentIndex = index;
        const img = allImages[index];
        lightboxImg.src = img.src + '?t=' + Date.now();
        currentIndexSpan.textContent = index + 1;

        // Cập nhật trạng thái nút
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === allImages.length - 1;

        // Hiển thị bình luận
        const imgName = img.src.split('/').pop();
        const comments = commentsData[imgName] || [];
        commentList.innerHTML = '';
        if (comments.length === 0) {
            commentList.innerHTML = '<p class="no-comment">Chưa có bình luận</p>';
        } else {
            comments.forEach(c => {
                const div = document.createElement('div');
                div.className = 'comment';
                div.innerHTML = `
                    <div class="comment-header">
                        <span class="username">${c.username}</span>
                        <span class="vote">Vote: ${c.vote}</span>
                    </div>
                    <p>${c.content.replace(/\n/g, '<br>')}</p>
                `;
                commentList.appendChild(div);
            });
        }
    }

    // Click vào ảnh để mở lightbox
    items.forEach((item, index) => {
        item.addEventListener('click', () => {
            lightbox.classList.add('active');
            showImageByIndex(index);
        });
    });

    // Nút điều hướng
    prevBtn.onclick = () => {
        if (currentIndex > 0) showImageByIndex(currentIndex - 1);
    };

    nextBtn.onclick = () => {
        if (currentIndex < allImages.length - 1) showImageByIndex(currentIndex + 1);
    };

    // Đóng lightbox
    close.onclick = () => lightbox.classList.remove('active');
    lightbox.onclick = (e) => { if (e.target === lightbox) lightbox.classList.remove('active'); };

    // Phím tắt: Arrow Left/Right để điều hướng
    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'ArrowLeft') prevBtn.click();
        if (e.key === 'ArrowRight') nextBtn.click();
    });
});
</script>
</body></html>
